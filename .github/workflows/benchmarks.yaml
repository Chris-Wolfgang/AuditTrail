# BenchmarkDotNet runs the audit perf suite and publishes results to gh-pages
# on every push to main -- a backward-looking trend chart (#184/P2).
#
# The forward-looking, per-PR regression gate lives in pr-benchmarks.yaml
# (#64): it runs the suite on the PR's HEAD and on its merge-base, posts a
# delta table, and can be overridden with the perf-impact-acknowledged
# label. That workflow replaced this one's old `benchmark-pr` job so BDN
# only runs once per PR push, under one gate, not two. It deliberately
# stays scoped to the fast, dependency-free SaveChangesBenchmarks (SQLite)
# class -- ProviderSaveChangesBenchmarks (SqlServer/PostgreSQL/Oracle/Db2/
# MySQL, all via Testcontainers) is charted here instead, on the
# once-per-main-push cadence, since spinning up multiple containers plus a
# second net8.0 run twice per PR (head + merge-base) would make every PR
# slow and expensive for comparatively little benefit -- a trend chart
# already answers "did this regress" without needing a live A/B per PR.
#
# ProviderSaveChangesBenchmarks is a [Params] cross-product (Provider x
# BatchSize x UseBulkInsert) over 6 [Benchmark] methods -- 36 cases PER
# PROVIDER when run unfiltered (confirmed locally: `--filter *Sqlite*`
# alone reports "Found 36 benchmark(s)"), and BenchmarkDotNet's
# [GlobalSetup]/[GlobalCleanup] -- where each case starts/stops its own
# Testcontainer -- run once per CASE, not once per provider. Unfiltered,
# that's ~180 container start/stop cycles for the net10.0 slot alone, far
# past any sane CI budget. The --filter below narrows the CI-charted slice
# to the 2 methods (Insert_without_audit / Insert_with_audit) that most
# directly answer "did audit overhead regress", at a single BatchSize (50
# -- larger operations give a cleaner signal-to-noise ratio, same reasoning
# as pr-benchmarks.yaml's TIME_ABS_FLOOR_NS) and UseBulkInsert: false (the
# bulk-insert path only differs from the standard path on PostgreSQL --
# CanHandle declines everywhere else -- so trending it for every provider
# would double the container count for a no-op signal on 4 of 5). That's
# 2 cases/provider: 10 for the net10.0 slot (5 providers, 4 containerized),
# 2 for the net8.0 MySQL slot -- ~10 container cycles per run instead of
# ~180. The full cross-product (all methods/batch sizes/UseBulkInsert) is
# still available for local ad-hoc `dotnet run` -- this filter only scopes
# the CI trend chart.
#
# First-time setup requirements (one-time, by repo owner):
#   - A `gh-pages` branch must exist (the chart pushes to dev/bench/ under it).
#   - GH Actions permissions must allow workflow writes to the repo (Settings ->
#     Actions -> General -> Workflow permissions -> Read and write).

name: Benchmarks

# Default least-privilege; per-job permissions override below.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Main-branch runs: contents:write so the chart can be auto-pushed to gh-pages.
  # Only runs from the trusted main branch.
  # ---------------------------------------------------------------------------
  benchmark-main:
    # contents:write must only be granted to runs from the trusted main
    # branch. workflow_dispatch can fire against any ref (including PR
    # branches via the API), so guard explicitly on github.ref in addition
    # to the event name.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: Benchmark + publish chart (main)
    runs-on: ubuntu-latest
    # SQLite alone finishes in a couple of minutes; the provider suite adds
    # ~10 Testcontainer start/stop cycles (see the --filter rationale above)
    # across SqlServer/PostgreSQL/Oracle/Db2 (net10.0) + MySQL (net8.0).
    # Oracle in particular is slow per-operation (single-digit seconds,
    # confirmed locally) and Testcontainers doesn't reliably detect a dead
    # container (observed locally: an exited container hung the readiness
    # poll indefinitely instead of erroring) -- this budgets generously so a
    # real hang times out the JOB rather than the runner minute quota.
    timeout-minutes: 90
    permissions:
      contents: write
      deployments: write   # per the action's own docs: "deployments permission to deploy GitHub pages website"
      issues: write        # required to file a tracking issue on failure

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not persist the GITHUB_TOKEN into the checkout's git config.
          # The PR job runs arbitrary contributor code via `dotnet run`; a
          # persisted token would be readable from that code. The push job
          # below uses peaceiris/actions-gh-pages, which receives the token
          # explicitly — it doesn't need the persisted credential either.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 8.0.x is required to actually RUN (not just build) the
          # net8.0-targeted MySQL provider benchmark below -- matches
          # integration.yaml's identical multi-SDK setup for the same reason.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker is available
        # The provider benchmarks below need Docker for every provider except
        # SQLite -- fail fast with a clear signal if it's ever missing, rather
        # than a confusing Testcontainers connection error three steps later.
        run: |
          docker version
          docker info

      - name: Run SaveChangesBenchmarks (SQLite)
        run: |
          dotnet run \
            --project benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks.csproj \
            --configuration Release \
            --framework net10.0 \
            -- \
            --exporters json \
            --filter '*Wolfgang.AuditTrail.Benchmarks.SaveChangesBenchmarks*' \
            --memory
        # Filter scoped to the SQLite-only SaveChangesBenchmarks, which stays
        # net10.0-only. Uses BDN's default artifacts dir, unchanged from
        # before -- the provider runs below use --artifacts to keep their
        # reports separate instead.

      - name: Locate SaveChangesBenchmarks report JSON
        id: locate-sqlite
        run: |
          # BDN 0.15.x emits *-report-full-compressed.json instead of the old
          # *-report-full.json. Match either so we ride out BDN renames cleanly.
          report=$(find . -path '*/BenchmarkDotNet.Artifacts/results/*SaveChangesBenchmarks-report-full*.json' -not -path '*ProviderSaveChangesBenchmarks*' | head -1)
          if [ -z "$report" ]; then
            echo "No BDN report found"
            exit 1
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Run ProviderSaveChangesBenchmarks (SqlServer/PostgreSQL/Oracle/Db2)
        run: |
          dotnet run \
            --project benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks.csproj \
            --configuration Release \
            --framework net10.0 \
            -- \
            --exporters json \
            --filter '*ProviderSaveChangesBenchmarks.Insert_without_audit(Provider: *, BatchSize: 50, UseBulkInsert: False)*' '*ProviderSaveChangesBenchmarks.Insert_with_audit(Provider: *, BatchSize: 50, UseBulkInsert: False)*' \
            --memory \
            --job short \
            --artifacts ./bdn-providers-net10
        # -j short (fewer iterations/warmup than BDN's default job) keeps this
        # bounded given Oracle's per-operation cost -- still a real statistical
        # measurement, just less precise than a full local run. --artifacts
        # keeps this run's report from colliding with the SQLite run above or
        # the net8.0 MySQL run below (same class name, would otherwise
        # overwrite the same default-path file). The two --filter patterns
        # (Insert_without_audit / Insert_with_audit, both pinned to
        # BatchSize: 50 and UseBulkInsert: False, any Provider) scope this to
        # 10 cases instead of the unfiltered 180 -- see the top-of-file
        # rationale. Confirmed locally that this exact literal template
        # (`Provider: <value>, BatchSize: 50, UseBulkInsert: False`) matches
        # BDN's real case-name format via a live --filter test.

      - name: Locate net10.0 provider report JSON
        id: locate-providers-net10
        run: |
          report=$(find ./bdn-providers-net10 -path '*/results/*ProviderSaveChangesBenchmarks-report-full*.json' | head -1)
          if [ -z "$report" ]; then
            echo "No BDN report found for net10.0 providers"
            exit 1
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Drop failed cases from the net10.0 provider report
        id: filter-net10
        env:
          # Passed via env, not interpolated directly into the script, so a
          # step-output value can never be read as shell syntax (zizmor
          # template-injection finding on the PR that introduced this step --
          # this output is never attacker-influenced today, a `find` result
          # under our own checkout, but the indirection costs nothing and
          # matches this repo's established convention elsewhere).
          REPORT: ${{ steps.locate-providers-net10.outputs.report }}
        run: |
          # A single provider's transient failure (e.g. a container registry
          # timeout -- observed for real: Db2's image pull hit a Docker
          # InternalServerError against icr.io on 2026-09-15) leaves that
          # case's `Statistics`/`Memory` null in the JSON report while
          # `dotnet run` itself still exits 0. benchmark-action's own
          # comparison logic then throws "Cannot read properties of null
          # (reading 'Mean')" on that null entry, crashing the ENTIRE
          # chart-push step -- which discards every OTHER provider's
          # perfectly good data for the day, not just the failed one's, and
          # (by GH Actions' default step-skip-on-failure behavior) also
          # skips the MySQL and SQLite chart-push steps below it. Stripping
          # null-Statistics entries here keeps one provider's infra flake
          # from costing the whole day's chart data.
          total=$(jq '.Benchmarks | length' "$REPORT")
          jq '.Benchmarks |= map(select(.Statistics != null))' "$REPORT" > "$REPORT.filtered"
          mv "$REPORT.filtered" "$REPORT"
          kept=$(jq '.Benchmarks | length' "$REPORT")
          if [ "$kept" -lt "$total" ]; then
            echo "::warning::Dropped $((total - kept)) failed benchmark case(s) (null Statistics) from the net10.0 provider report before charting -- see the 'Run ProviderSaveChangesBenchmarks (SqlServer/PostgreSQL/Oracle/Db2)' step log for which provider/case failed and why."
          fi
          if [ "$kept" -eq 0 ]; then
            # Skip only THIS chart's push (via the step output below), rather
            # than failing the step outright -- an earlier version of this
            # fix used `exit 1` here, which (GH Actions' default
            # skip-after-failure) would have skipped the MySQL and SQLite
            # chart-pushes too, recreating the exact cascading-failure bug
            # this whole PR exists to eliminate, just moved one step over.
            # Real finding from Copilot's review on this PR -- verified by
            # re-reading the step order before "fixing" it a second time.
            echo "::warning::Every net10.0 provider case failed this run -- nothing left to chart. Skipping only this chart's push; MySQL and SQLite charts still run."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ProviderSaveChangesBenchmarks (MySQL)
        run: |
          dotnet run \
            --project benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks.csproj \
            --configuration Release \
            --framework net8.0 \
            -- \
            --exporters json \
            --filter '*ProviderSaveChangesBenchmarks.Insert_without_audit(Provider: *, BatchSize: 50, UseBulkInsert: False)*' '*ProviderSaveChangesBenchmarks.Insert_with_audit(Provider: *, BatchSize: 50, UseBulkInsert: False)*' \
            --memory \
            --job short \
            --artifacts ./bdn-providers-net8
        # MySQL is on its own net8.0 build (Pomelo is still EF9-capped, see
        # #272) -- a separate TFM, separate dotnet run, separate artifacts
        # dir. Same 2-case filter as the net10.0 run above (only Provider:
        # MySQL exists on this slot, so it's 2 cases here, not 10).

      - name: Locate net8.0 provider report JSON
        id: locate-providers-net8
        run: |
          report=$(find ./bdn-providers-net8 -path '*/results/*ProviderSaveChangesBenchmarks-report-full*.json' | head -1)
          if [ -z "$report" ]; then
            echo "No BDN report found for net8.0 providers"
            exit 1
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Drop failed cases from the net8.0 provider report
        id: filter-net8
        env:
          REPORT: ${{ steps.locate-providers-net8.outputs.report }}
        run: |
          # Same rationale as the net10.0 filter step above -- only one
          # provider (MySQL) runs on this slot, but a transient container
          # failure here would otherwise crash this chart-push AND skip the
          # SQLite chart-push after it.
          total=$(jq '.Benchmarks | length' "$REPORT")
          jq '.Benchmarks |= map(select(.Statistics != null))' "$REPORT" > "$REPORT.filtered"
          mv "$REPORT.filtered" "$REPORT"
          kept=$(jq '.Benchmarks | length' "$REPORT")
          if [ "$kept" -lt "$total" ]; then
            echo "::warning::Dropped $((total - kept)) failed benchmark case(s) (null Statistics) from the net8.0 provider report before charting -- see the 'Run ProviderSaveChangesBenchmarks (MySQL)' step log for why."
          fi
          if [ "$kept" -eq 0 ]; then
            # See the net10.0 filter step above for why this skips only this
            # chart's push instead of failing the step outright.
            echo "::warning::Every net8.0 provider case failed this run -- nothing left to chart. Skipping only this chart's push; the SQLite chart still runs."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      # fail-on-alert is deliberately false for the provider charts, unlike
      # SQLite's below. This is the first CI run of these benchmarks ever --
      # Oracle's own numbers already showed multi-second swings between
      # otherwise-identical local runs (container/network variance dominates
      # at that scale), and this repo has hit repeated shared-runner false
      # positives on the SQLite gate alone (#276, #280, #290 twice). Chart
      # first, tune real alert thresholds per provider once genuine baseline
      # noise is visible on gh-pages -- flipping this on blind would likely
      # just repeat that history at a worse (multi-container) blast radius.
      #
      # net10.0 and net8.0(MySQL) publish under DIFFERENT `name` values even
      # though they share `benchmark-data-dir-path: dev/bench-providers`.
      # The action's own addBenchmarkEntry keys its "previous suite" lookup
      # by `name`, walking backward for the most recent entry with a
      # DIFFERENT commit ID -- with one shared name, the net10.0 step's
      # prevBench (on every run) resolves to the net8.0/MySQL-only entry
      # this same job just pushed moments earlier (same commit ID skipped,
      # next-most-recent picked), and vice versa, so no case names ever
      # match between "current" and "previous" and alerting silently never
      # fires for either slot. Separate names keep each slot's own history
      # self-contained and alert-comparable once thresholds are tuned.
      - name: Store + push net10.0 provider chart history
        if: steps.filter-net10.outputs.empty != 'true'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Audit Interceptor Provider Benchmarks (net10.0)
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate-providers-net10.outputs.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench-providers
          auto-push: true
          fail-on-alert: false

      - name: Store + push net8.0 provider (MySQL) chart history
        if: steps.filter-net8.outputs.empty != 'true'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Audit Interceptor Provider Benchmarks (MySQL net8.0)
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate-providers-net8.outputs.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench-providers
          auto-push: true
          fail-on-alert: false

      # Deliberately LAST among the chart-push steps (not right after the
      # SQLite report is located, like before). This is the only step with
      # fail-on-alert: true, and a GitHub Actions step failure skips every
      # later step by default -- with this step earlier, an SQLite alert
      # (this repo has hit several false positives: #276, #280, #290 twice)
      # would abort the job before the provider steps below it ever ran,
      # silently starving the just-added provider chart of any data point
      # on exactly the runs where SQLite's gate misfires. Running it last
      # means both provider charts are already pushed by the time this can
      # fail.
      - name: Store + push SQLite chart history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Audit Interceptor Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate-sqlite.outputs.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: '200%'
          fail-on-alert: true

      # This job only runs on push to main -- by the time an alert fails it, the
      # regression is already merged. There's no PR to bounce and no reviewer
      # watching; without this, the only signal is a red X on the Actions tab
      # that nobody proactively checks. Mirrors shadow.yaml's exact pattern.
      - name: File a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Label creation isn't just cosmetic here -- until 2026-09-15 this
          # whole step had never actually run (no benchmarks.yaml run had
          # ever failed since #271 added it), and its first real run failed
          # BECAUSE `gh issue create --label benchmark-regression` hard-fails
          # when the label doesn't exist yet and label creation silently
          # failed (root cause not recoverable from the swallowed
          # `2>/dev/null` output -- fixed here to stay visible instead).
          # Below, `|| true` keeps a real creation failure from aborting this
          # step, but the ISSUE-FILING itself now has its own fallback: if
          # filing with the label fails for any reason, retry once without
          # it, so a labeling hiccup can never silently swallow the one
          # thing this step exists to guarantee -- a human gets notified.
          gh label create benchmark-regression --color B60205 \
            --description "The push-to-main benchmark trend run found a performance/allocation regression, or the run itself failed" || true

          # Dedup by TITLE, not by label. If a prior run's labeled creation
          # failed and fell through to the unlabeled fallback below, that
          # issue carries no label -- a label-based dedup check would never
          # see it, so every subsequent failed run would file a fresh
          # duplicate instead of finding the existing one (real finding from
          # Copilot's review on this PR).
          open_count="$(gh issue list --state open --search 'in:title "Benchmark trend run found a regression, or the run failed"' --json number --jq 'length' 2>/dev/null || echo 0)"
          if [ "${open_count:-0}" -gt 0 ]; then
            echo "An open benchmark-regression issue already exists — not filing another."
            exit 0
          fi

          body="The push-to-main benchmark run either alerted beyond threshold (SQLite only -- the provider charts don't gate yet) or failed outright.

          Check the \`Audit Interceptor Benchmarks\` chart (dev/bench on gh-pages) and, if relevant, the \`Audit Interceptor Provider Benchmarks (net10.0)\` / \`... (MySQL net8.0)\` charts (dev/bench-providers) for the specific benchmark(s) and magnitude, and check the run log for a non-alert failure (e.g. a Testcontainers/Docker issue).

          Run: ${RUN_URL}"

          if ! gh issue create \
            --title "Benchmark trend run found a regression, or the run failed" \
            --label benchmark-regression \
            --body "$body"; then
            echo "::warning::Filing with the benchmark-regression label failed (label creation likely failed above) -- retrying without a label so the notification isn't lost."
            gh issue create \
              --title "Benchmark trend run found a regression, or the run failed" \
              --body "$body"
          fi
