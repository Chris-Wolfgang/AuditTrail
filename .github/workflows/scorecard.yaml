name: OSSF Scorecard

# Automated security-posture scoring (OpenSSF Scorecard). Runs on a weekly
# schedule and on pushes to main, publishing results to the GitHub Security tab
# (SARIF) and to the public OpenSSF results store. Read-only; advisory only —
# this does not gate PRs.

on:
  branch_protection_rule:
  schedule:
    - cron: '24 5 * * 1'   # Mondays 05:24 UTC
  push:
    branches: [ main ]

# read-all is broader than this repo's usual contents:read top-level default
# (it also grants read on issues/PRs/actions/etc.) -- required by the
# upstream Scorecard action itself, which inspects those signals to compute
# several checks (e.g. Branch-Protection, Code-Review). The analysis job
# below only widens what it additionally needs to WRITE.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only `uses:` steps, and only from scorecard.dev's allow-list. The webapp
  # verifies this job before accepting `publish_results: true`, and rejects it
  # with HTTP 400 ("scorecard job must only have steps with `uses`") if it finds
  # a `run:` step. scorecard-action downgrades that to a warning, so the run
  # stays green while nothing is ever published and the README badge serves a
  # stale score. Post-processing therefore lives in the `upload` job below;
  # keep this job free of `run:`.
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # No security-events: write here -- the SARIF is uploaded by the job
      # below. Job-level permissions replace the workflow-level read-all, so
      # contents: read has to be restated for checkout.
      id-token: write          # publish results to the OpenSSF store
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish so the repo earns an OpenSSF Scorecard badge and the score
          # is visible at https://securityscorecards.dev.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

  upload:
    name: Filter and upload SARIF
    needs: analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      contents: read
    steps:
      # Checked out before the download, and first in the job: checkout cleans
      # the workspace, so downloading the artifact ahead of it would delete the
      # SARIF. The working tree is needed so upload-sarif computes the same
      # source fingerprints it did when this ran in the analysis job; without
      # it, fingerprints drift and existing alerts reappear under new IDs.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-sarif

      # Suppress Scorecard findings that are known won't-fix for this repo,
      # BEFORE the SARIF reaches code-scanning. Doing it here (rather than
      # dismissing individual alerts) makes the suppression durable across
      # weekly re-runs — Scorecard emits a fresh SARIF each run, and
      # fingerprint drift means dismissals do not always survive.
      #
      # Suppressed PinnedDependenciesID sub-check (partial rule):
      #   nugetCommand — `dotnet restore` is not hash-pinned. Every csproj in
      #                  this repo already uses explicit PackageReference
      #                  Versions (no floating ranges), and Dependabot's
      #                  `nuget` ecosystem bumps transitives. No repo in the
      #                  fleet ships packages.lock.json; adopting
      #                  `--locked-mode` is a separate fleet-wide decision.
      #
      # Suppressed whole rule:
      #   CodeReviewID — a solo-maintainer repository. The check counts changesets
      #                  approved by someone else ("Found 0/23 approved changesets"),
      #                  so it can only ever score 0 here. Satisfying it would mean
      #                  recruiting a second maintainer, or requiring approvals and
      #                  then admin-bypassing every PR — which waives every other
      #                  rule in the ruleset, not just this one. The rule has no
      #                  sub-case worth keeping live, so the whole rule goes.
      #
      # Nothing else is suppressed. `gitHubAction not pinned` rows stay live so
      # any regression to an @vN action ref without a SHA pin still fires, and
      # the other Scorecard rules (DangerousWorkflowID, BranchProtectionID,
      # CIIBestPracticesID) continue to report.
      #
      # BranchProtectionID is deliberately NOT suppressed, even though its current
      # warnings are the same solo-maintainer story (no required approvers, no
      # codeowners review, last-push approval off). It scores 4, not 0, because the
      # rest of the protection IS in place — so the rule still reports real
      # regressions, such as the ruleset being deleted or force-pushes being
      # allowed. Suppressing it would trade those away. Tracked in #338.
      #
      # The scorecard.dev score published to the transparency log (README
      # badge) still counts every check; this only trims code-scanning noise.
      - name: Filter suppressed findings from SARIF
        shell: bash
        env:
          # Whole rules dropped regardless of message. Space-separated.
          SUPPRESSED_RULES: 'CodeReviewID'
          # Substrings matched against each PinnedDependenciesID result's
          # message text. Order-independent; a single match suppresses.
          SUPPRESSED_PIN_KINDS: 'nugetCommand not pinned'
        run: |
          # pipefail matters for the rules_json pipeline below: the implicit shell is
          # `bash -e` without it, so a jq failure mid-pipe would pass an empty list
          # through and silently suppress nothing.
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not available on the runner; cannot filter SARIF."
            exit 1
          fi
          # Word-splitting is intentional: one rule per line for the jq -R/-s pipeline.
          # shellcheck disable=SC2086
          rules_json=$(printf '%s\n' $SUPPRESSED_RULES | jq -R . | jq -s .)
          echo "Suppressed rules: $SUPPRESSED_RULES"
          jq \
            --argjson suppressed "$rules_json" \
            --arg pinKinds "$SUPPRESSED_PIN_KINDS" \
            '
              .runs |= map(
                .results |= map(select(
                  (.ruleId // "") as $r
                  | (.message.text // "") as $t
                  # $r is bound before use on purpose: inside
                  # `$suppressed | index(.ruleId)` the path would apply to the array
                  # rather than the result -- jq 1.8 errors, older jq silently keeps
                  # everything, which fails open.
                  | (($suppressed | index($r)) == null)
                    and ((($r == "PinnedDependenciesID") and ($t | test($pinKinds))) | not)
                ))
              )
            ' results.sarif > results.filtered.sarif
          before=$(jq '[.runs[].results[]] | length' results.sarif)
          after=$(jq '[.runs[].results[]] | length' results.filtered.sarif)
          echo "Scorecard SARIF results: $before -> $after after suppression"
          mv results.filtered.sarif results.sarif

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        env:
          # Pin the analysis key to what it was before this split. The action derives
          # it from "<workflow path>:<GITHUB_JOB>" (api-client.ts getAnalysisKey), so
          # moving this step into the upload job would silently change it from
          # scorecard.yaml:analysis to scorecard.yaml:upload. The old key would then
          # stop receiving uploads, and alerts recorded under it -- currently the
          # BranchProtectionID and CodeReviewID findings -- would stay open forever
          # because nothing ever reports them fixed, while a duplicate set appeared
          # under the new key. Checkout keeps source fingerprints stable; it does not
          # preserve this identity.
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/scorecard.yaml:analysis
        with:
          sarif_file: results.sarif
