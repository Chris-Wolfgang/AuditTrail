name: Workflow security audit

# Lints the GitHub Actions workflows themselves for correctness (actionlint) and
# for workflow-level security issues — untrusted-input injection into run blocks,
# over-broad permissions, expression-context secret leaks (zizmor). Advisory:
# surfaces findings as annotations / in the Security tab; does not gate PRs.
#
# The path filters below must cover every file zizmor reads, not just the
# workflows: it also audits .github/dependabot.yml (dependabot-cooldown et al.)
# and reads its rule waivers from zizmor.yml. A file left out of the filters
# never re-triggers the audit, so a fix to it sits unreconciled — and stale
# findings stay open in the Security tab — until the Monday cron fires.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - 'zizmor.yml'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - 'zizmor.yml'
  schedule:
    - cron: '30 4 * * 1'   # Mondays 04:30 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-check
          level: warning
          fail_level: none   # advisory — report findings without failing the job

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install zizmor
        run: pipx install zizmor==1.26.1

      - name: Run zizmor
        # Non-gating: zizmor exits non-zero when it finds issues; we still want
        # the SARIF uploaded so findings show in the Security tab.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # --config points at repo-root zizmor.yml (rule waivers with rationale).
        run: zizmor --config zizmor.yml --format sarif . > zizmor.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: zizmor.sarif
          category: zizmor
