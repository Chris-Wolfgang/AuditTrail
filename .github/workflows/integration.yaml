# Integration tests against real database engines via Testcontainers.
#
# Runs on Linux only — GitHub-hosted ubuntu runners come with Docker pre-installed,
# which Testcontainers uses to spin up SQL Server, PostgreSQL, and MySQL containers
# per test class. Windows / macOS runners don't have Docker out of the box, so this
# workflow doesn't try to run there. The unit suite in pr.yaml covers the
# cross-platform invariants.
#
# The integration test csproj sets <IsTestProject> only when RunIntegrationTests=true.
# Without that env var, `dotnet test` discovers no test framework and the project is
# a no-op when pr.yaml iterates over ./tests/*. (pr.yaml's discovery enumerates every
# *.csproj under ./tests and invokes `dotnet test` on each; the project IS visited,
# it just runs zero tests.) This workflow sets RunIntegrationTests=true so the same
# project becomes a normal test project here.

name: Integration Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RunIntegrationTests: 'true'

jobs:
  integration:
    name: Integration Tests (Linux + Docker)
    # Pinned to 24.04: on ubuntu-latest (26.04) the IBM DB2 driver's native libdb2.so fails to
    # load and every Db2AuditTests case fails. Keep the pin until the DB2 driver loads on 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Both SDKs are needed because the provider set straddles two EF Core
          # majors. Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration and
          # Wolfgang.AuditTrail.EntityFrameworkCore.Schema.Tests.Integration each
          # carry MySQL on a net8.0 slot (Pomelo.EntityFrameworkCore.MySql lags EF
          # Core by one major; bump those TFMs + this SDK list together when it
          # ships a stable 10.x) and the rest on net10.0. The Npgsql-only
          # Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql.Tests.Integration has no
          # such constraint and targets net10.0.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: Pre-pull the Db2 image (retry on registry timeouts)
        # icr.io (IBM's registry) intermittently times out from hosted runners; Testcontainers
        # retries its own pull only three times, a couple of seconds apart, and every Db2 test
        # then fails. Pull the image here with a longer back-off so the tests find it locally.
        # The image name is read from the fixture so this step cannot drift from the tests.
        # A pull that still fails after the retries fails the job: nothing is skipped.
        run: |
          image=$(grep -ohE 'icr\.io/[A-Za-z0-9_./-]+:[A-Za-z0-9_.-]+' tests/Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration/TestSupport/Db2Fixture.cs | head -1)
          if [ -z "$image" ]; then
            echo "::error::No icr.io image reference found in Db2Fixture.cs"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              exit 0
            fi
            echo "::warning::docker pull of $image failed (attempt $attempt of 5)"
            sleep $((attempt * 20))
          done
          echo "::error::Could not pull $image after 5 attempts"
          exit 1

      - name: Restore
        run: |
          dotnet restore tests/Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration.csproj
          dotnet restore tests/Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql.Tests.Integration.csproj
          dotnet restore tests/Wolfgang.AuditTrail.EntityFrameworkCore.Schema.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Schema.Tests.Integration.csproj

      - name: Build
        run: |
          dotnet build tests/Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration.csproj \
            --no-restore \
            --configuration Release
          dotnet build tests/Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql.Tests.Integration.csproj \
            --no-restore \
            --configuration Release
          dotnet build tests/Wolfgang.AuditTrail.EntityFrameworkCore.Schema.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Schema.Tests.Integration.csproj \
            --no-restore \
            --configuration Release

      - name: Run integration tests
        run: |
          dotnet test tests/Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Tests.Integration.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory TestResults
          dotnet test tests/Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql.Tests.Integration.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=npgsql-integration.trx" \
            --results-directory TestResults
          dotnet test tests/Wolfgang.AuditTrail.EntityFrameworkCore.Schema.Tests.Integration/Wolfgang.AuditTrail.EntityFrameworkCore.Schema.Tests.Integration.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=schema-integration.trx" \
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: warn
