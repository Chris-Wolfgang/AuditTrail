# Per-PR performance regression gate (#64).
#
# Distinct from benchmarks.yaml: that workflow graphs the BDN trend on every
# push to main (backward-looking, #184/P2) and its PR-side job alerts against
# the last main-branch gh-pages snapshot at a flat 200% threshold. This
# workflow is forward-looking and per-PR: it runs the benchmark suite twice
# -- once on the PR's own HEAD, once on the merge-base commit where the PR
# branched off its base -- so the comparison isolates exactly this PR's
# diff (not whatever else has landed on base since). It always posts a full
# delta table (not just on alert), applies separate time/allocation
# thresholds, and can be overridden per-PR with the perf-impact-acknowledged
# label. benchmarks.yaml's PR job is being removed in the same change that
# adds this, so BDN only runs once per PR push, not twice under two
# different gates.

name: PR Benchmarks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'benchmarks/**'

concurrency:
  group: pr-benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TIME_THRESHOLD_PCT: '20'
  ALLOC_THRESHOLD_PCT: '50'
  BENCH_FILTER: '*Wolfgang.AuditTrail.Benchmarks.SaveChangesBenchmarks*'
  BENCH_PROJECT: benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks/Wolfgang.AuditTrail.EntityFrameworkCore.Benchmarks.csproj

jobs:
  perf-delta:
    name: Benchmark delta vs base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the merge-base lookup below needs both the PR
          # head and base-branch ancestry, and the default shallow clone
          # only carries the merge commit itself.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Find merge-base commit
        id: mergebase
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks on PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout "$HEAD_SHA"
          dotnet run \
            --project "$BENCH_PROJECT" \
            --configuration Release \
            -- \
            --exporters json \
            --filter "$BENCH_FILTER" \
            --memory \
            --artifacts ./bdn-artifacts-head

      - name: Clean build outputs before switching commits
        # bin/obj from the head build must not leak into the merge-base
        # build -- MSBuild incremental builds are timestamp-based and could
        # otherwise mix stale outputs across the two different commits.
        # Excludes the head-run's exported artifacts dir, which is untracked
        # and would otherwise be swept up by -x too.
        run: git clean -xdf -e bdn-artifacts-head

      - name: Run benchmarks on merge-base
        env:
          MERGE_BASE_SHA: ${{ steps.mergebase.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout "$MERGE_BASE_SHA"
          dotnet run \
            --project "$BENCH_PROJECT" \
            --configuration Release \
            -- \
            --exporters json \
            --filter "$BENCH_FILTER" \
            --memory \
            --artifacts ./bdn-artifacts-base

      - name: Compute delta
        id: delta
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          head_report="$(find ./bdn-artifacts-head -path '*/results/*SaveChangesBenchmarks-report-full*.json' | head -1)"
          base_report="$(find ./bdn-artifacts-base -path '*/results/*SaveChangesBenchmarks-report-full*.json' | head -1)"
          if [ -z "$head_report" ] || [ -z "$base_report" ]; then
            echo "::error::Missing a BDN report (head='$head_report' base='$base_report')"
            exit 1
          fi

          rows="$(jq -n \
            --slurpfile head "$head_report" \
            --slurpfile base "$base_report" \
            --argjson timeThreshold "$TIME_THRESHOLD_PCT" \
            --argjson allocThreshold "$ALLOC_THRESHOLD_PCT" \
            '
            ($base[0].Benchmarks | map({(.FullName): .}) | add) as $baseByName |
            [$head[0].Benchmarks[] |
              . as $h |
              $baseByName[$h.FullName] as $b |
              select($b != null) |
              (($h.Statistics.Mean - $b.Statistics.Mean) / $b.Statistics.Mean * 100) as $timePct |
              (($h.Memory.BytesAllocatedPerOperation - $b.Memory.BytesAllocatedPerOperation) / $b.Memory.BytesAllocatedPerOperation * 100) as $allocPct |
              {
                name: $h.FullName,
                baseMeanNs: $b.Statistics.Mean, headMeanNs: $h.Statistics.Mean, timePct: ($timePct | round),
                baseAllocBytes: $b.Memory.BytesAllocatedPerOperation, headAllocBytes: $h.Memory.BytesAllocatedPerOperation, allocPct: ($allocPct | round),
                regressed: (($timePct > $timeThreshold) or ($allocPct > $allocThreshold))
              }
            ] | sort_by(-.timePct)
            ')"

          echo "$rows" > ./delta.json
          regressed_count="$(echo "$rows" | jq '[.[] | select(.regressed)] | length')"
          echo "regressed=$regressed_count" >> "$GITHUB_OUTPUT"

          {
            echo "table<<BENCHDELTA"
            echo "| Benchmark | Base mean | Head mean | Δ time | Base alloc | Head alloc | Δ alloc |"
            echo "|---|---:|---:|---:|---:|---:|---:|"
            echo "$rows" | jq -r '.[] | "| \(.name) | \(.baseMeanNs/1000|round) us | \(.headMeanNs/1000|round) us | \(if .regressed then "**" else "" end)\(.timePct)%\(if .regressed then "**" else "" end) | \(.baseAllocBytes) B | \(.headAllocBytes) B | \(if .regressed then "**" else "" end)\(.allocPct)%\(if .regressed then "**" else "" end) |"'
            echo "BENCHDELTA"
          } >> "$GITHUB_OUTPUT"

          if [ "$regressed_count" -gt 0 ] && [[ ",$LABELS," != *",perf-impact-acknowledged,"* ]]; then
            echo "acknowledged=false" >> "$GITHUB_OUTPUT"
          else
            echo "acknowledged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment delta table on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: perf-delta
          message: |
            ### Benchmark delta vs base (`${{ steps.mergebase.outputs.sha }}`)

            Time threshold: ${{ env.TIME_THRESHOLD_PCT }}% · Allocation threshold: ${{ env.ALLOC_THRESHOLD_PCT }}%. Bold = over threshold.

            ${{ steps.delta.outputs.table }}

            ${{ steps.delta.outputs.regressed != '0' && (steps.delta.outputs.acknowledged == 'true' && '⚠️ Regression(s) found, but the PR carries `perf-impact-acknowledged` -- not blocking.' || '🔴 Regression(s) found beyond threshold. Add the `perf-impact-acknowledged` label to override, or address the regression.') || '✅ No regressions beyond threshold.' }}

      - name: Fail on unacknowledged regression
        if: steps.delta.outputs.acknowledged == 'false'
        run: |
          echo "::error::${{ steps.delta.outputs.regressed }} benchmark(s) regressed beyond threshold (time >${TIME_THRESHOLD_PCT}%, alloc >${ALLOC_THRESHOLD_PCT}%). Add the 'perf-impact-acknowledged' label to override."
          exit 1

      - name: Upload delta artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-benchmark-delta
          path: ./delta.json
          if-no-files-found: warn
