name: Build reproducibility

# Verifies that the same commit builds to byte-identical assemblies and symbols on
# Ubuntu and Windows: every TFM's .dll and .pdb of every packable src project is
# hashed on both runners and the job FAILS on any difference. The deterministic-build
# knobs in Directory.Build.props (<Deterministic>, <ContinuousIntegrationBuild>,
# SourceLink + EmbedUntrackedSources) plus Directory.Build.targets' LF normalization
# of the SDK-generated sources are what make that hold. Package files (.nupkg /
# .snupkg) are not compared: NuGet stamps the pack time into every zip entry, so two
# packs of one commit differ even on one machine. See docs/REPRODUCIBLE-BUILD.md.

on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1'   # Mondays 05:40 UTC

permissions:
  contents: read

concurrency:
  # Scheduled / manually dispatched only; queue rather than cancel, so a long run
  # is never killed by a second trigger on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build src (every TFM, Release, deterministic)
        shell: bash
        run: |
          for name in \
            Wolfgang.AuditTrail.Abstractions \
            Wolfgang.AuditTrail.EntityFrameworkCore \
            Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql \
            Wolfgang.AuditTrail.TestKit.Xunit
          do
            dotnet build "src/$name/$name.csproj" -c Release -p:ContinuousIntegrationBuild=true
          done

      - name: Hash assemblies and symbols
        shell: bash
        run: |
          set -euo pipefail
          out="hashes-${{ matrix.os }}.txt"
          : > "$out"
          for name in \
            Wolfgang.AuditTrail.Abstractions \
            Wolfgang.AuditTrail.EntityFrameworkCore \
            Wolfgang.AuditTrail.EntityFrameworkCore.Npgsql \
            Wolfgang.AuditTrail.TestKit.Xunit
          do
            base="src/$name/bin/Release"
            # Keyed by <project>/<tfm>/<file>, so the two runners' lines line up.
            while IFS= read -r f; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$name/${f#"$base"/}" >> "$out"
            done < <(find "$base" -type f \( -name "$name.dll" -o -name "$name.pdb" \) | sort)
          done
          if [ ! -s "$out" ]; then
            echo "::error::No assemblies were hashed - the build output layout changed."
            exit 1
          fi
          sort -k2 "$out" -o "$out"
          echo "== ${{ matrix.os }} =="
          cat "$out"

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt

  compare:
    name: Compare across runners
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: hashes

      - name: Diff manifests
        shell: bash
        run: |
          ubuntu="hashes/hashes-ubuntu-latest/hashes-ubuntu-latest.txt"
          windows="hashes/hashes-windows-latest/hashes-windows-latest.txt"
          echo "== ubuntu-latest =="; cat "$ubuntu"
          echo "== windows-latest =="; cat "$windows"
          if diff -u "$ubuntu" "$windows"; then
            echo "✅ Reproducible: every .dll and .pdb matches across ubuntu + windows."
          else
            echo "::error::Assembly/symbol hashes differ across runners - the build is not byte-identical cross-OS. Check Directory.Build.targets' line-ending normalization, embedded paths and SourceLink."
            exit 1
          fi
